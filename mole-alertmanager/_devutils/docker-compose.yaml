# Local dev / test Alertmanager for the mole-alertmanager plugin.
#
#   docker compose -f mole-alertmanager/_devutils/docker-compose.yaml up -d --wait
#
# Obscure host port 59093 (→ container 9093, Alertmanager's default) to avoid
# colliding with a local Alertmanager. Matches the `alertmanager-local-dev`
# connection in ~/.config/mole/connections.yaml:
#
#   connections:
#     - name: alertmanager-local-dev
#       driver: alertmanager
#       url: http://localhost:59093
#
# SEEDING — two parts, because Alertmanager holds both CONFIG and runtime STATE:
#   * config    — initdb/alertmanager.yml defines the receivers (default,
#                 db-team, web-team) and routing, mounted at startup. This is what
#                 the `receivers` verb reads.
#   * state     — a one-shot `seeder` sidecar waits for health, then POSTs two
#                 active alerts (initdb/alerts.json → /api/v2/alerts, endsAt far in
#                 the future so they keep firing) and one silence
#                 (initdb/silence.json → /api/v2/silences). This is what `alerts`,
#                 `alert-groups`, `silences` and `silence <id>` read. (The seeder
#                 uses the write API; the plugin itself is read-only.)
name: mole-alertmanager-devutils

services:
  alertmanager:
    image: prom/alertmanager:latest
    container_name: mole-alertmanager-local-dev
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./initdb/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - mole-alertmanager-data:/alertmanager
    ports:
      - "59093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 3s
      timeout: 3s
      retries: 15

  seeder:
    image: curlimages/curl:latest
    depends_on:
      alertmanager:
        condition: service_healthy
    volumes:
      - ./initdb:/seed:ro
    entrypoint: ["sh", "/seed/seed.sh"]
    environment:
      AM_URL: http://alertmanager:9093
    restart: "no"

volumes:
  mole-alertmanager-data:
