# Dev Alertmanager config for the mole-alertmanager _devutils stack. Defines three
# receivers (null receivers — no real integrations needed for read-only testing)
# and routes alerts by `service`, so the `receivers` verb returns a non-trivial
# list and routing is exercised.
route:
  receiver: default
  group_by: ['alertname']
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
  routes:
    - receiver: db-team
      matchers:
        - service="database"
    - receiver: web-team
      matchers:
        - service="web"

receivers:
  - name: default
  - name: db-team
  - name: web-team
