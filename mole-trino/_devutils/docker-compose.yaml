# Local dev / test Trino for the mole-trino plugin.
#
#   docker compose -f mole-trino/_devutils/docker-compose.yaml up -d
#
# Obscure host port 58080 (→ container 8080) to avoid colliding with anything on
# the usual 8080. Matches the `trino-local-dev` connection in
# ~/.config/mole/connections.yaml (catalog tpch, schema tiny, user admin).
#
# No seeding: the image ships the built-in `tpch` connector enabled by default,
# which exposes ready-made schemas (tpch.tiny.customer, orders, lineitem, …) with
# real columns and a variety of types (bigint, varchar, decimal, date) — enough
# to exercise the type map and schema introspection out of the box. See
# initdb/README.md.
#
# Trino takes ~15-30s to become ready after boot; the healthcheck polls the
# coordinator's /v1/info endpoint (`ended` = true once startup finishes). Wait on
# it before running queries:
#   docker compose -f mole-trino/_devutils/docker-compose.yaml up -d --wait
name: mole-trino-devutils

services:
  trino:
    image: trinodb/trino:latest
    container_name: mole-trino-devutils
    ports:
      - "58080:8080"
    healthcheck:
      # /v1/info reports {"starting": false} and "ended":true once the
      # coordinator is up. `trino` CLI is on PATH in the image as a fallback.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
