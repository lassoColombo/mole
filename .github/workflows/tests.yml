name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.116.1'

      # Pinned to the same commit the local checkouts use (see run-tests.nu).
      - name: Install nutest
        run: |
          git clone https://github.com/vyadh/nutest.git "$RUNNER_TEMP/nutest"
          git -C "$RUNNER_TEMP/nutest" checkout c46af12bc6e3819b95d69f54f35526ca3e5810d6

      # Every module's suite: deterministic, no network, no external CLIs.
      # NU_LIB_DIRS carries the workspace (cross-module imports) and nutest's parent.
      - name: Run every nutest suite
        env:
          NU_LIB_DIRS: ${{ github.workspace }}:${{ runner.temp }}/nutest
        run: nu run-tests.nu --fail
