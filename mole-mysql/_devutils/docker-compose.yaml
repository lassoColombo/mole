# Local dev / test engines for the mole-mysql plugin.
#
#   docker compose -f mole-mysql/_devutils/docker-compose.yaml up -d
#
# mole-mysql exec is `^mysql` over the MYSQL WIRE PROTOCOL. The engines below are
# the ones that are TRUE drop-ins for both the mysql client AND the dialect — same
# wire protocol, same information_schema, same NATIVE `json` type — so they run
# through the one exec with no new code; file their connections under the `mysql`
# section. Each is on its own OBSCURE host port (→ container 3306), seeded from
# ./initdb so `schema`/`select`/`raw-query` can be exercised end to end. initdb/
# scripts run once, on first boot.
#
# MariaDB is deliberately NOT here: it is a NEAR-equivalent, not a true one — its
# client binary is `mariadb` (the `mysql` symlink is no longer guaranteed) and its
# `JSON` is a LONGTEXT alias, so it has its own plugin and dev stack. See
# mole-mariadb/_devutils/docker-compose.yaml.
#
# Host-port map (all → container 3306):
#   mysql     53306   (mysql:8.4)                     connection mysql-local-dev
#   percona   53308   (percona/percona-server:8.0)    connection percona-local-dev
#
# The seed (initdb/01-seed.sql) exercises the type map (tinyint(1)->bool, int,
# decimal, date/datetime/timestamp, json) and schema introspection (pk/fk/unique
# + table/column comments). Percona accepts the same DDL and exposes the same
# information_schema, so both share the one seed via the ./initdb mount and the
# mysql-family entrypoint (MYSQL_* env, *.sql on first boot).
name: mole-mysql-devutils

services:
  mysql:
    image: mysql:8.4
    container_name: mole-mysql-local-dev
    environment:
      MYSQL_ROOT_PASSWORD: mole
      MYSQL_DATABASE: demo
    ports:
      - "53306:3306"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - mole-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmole"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Percona Server for MySQL is a drop-in MySQL 8.0 fork: same wire protocol,
  # same information_schema, same MYSQL_* env and ./initdb hook, same NATIVE json
  # type; file it under the `mysql` section — it is a TRUE mole-mysql equivalent.
  percona:
    image: percona/percona-server:8.0
    container_name: mole-percona-local-dev
    environment:
      MYSQL_ROOT_PASSWORD: mole
      MYSQL_DATABASE: demo
    ports:
      - "53308:3306"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - mole-percona-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmole"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  mole-mysql-data:
  mole-percona-data:
